name: Release

# Push a tag to cut a release:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# That builds the app on Windows and attaches four installers to a
# GitHub Release: an .msi and an .exe that bundle .NET, and an .msi
# and an .exe that expect the .NET Desktop Runtime on the machine.
#
# Running this workflow manually instead builds the same installers
# and leaves them as workflow artifacts without publishing a release,
# which is the safe way to test a change to the packaging.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 1.0.0)'
        required: true
        default: '0.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build installers
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # A release must not ship from a red commit. The live Firebird
      # tests skip here, as they do in CI.
      - name: Test
        shell: pwsh
        run: dotnet test tests/EasyFbSoft.Tests/EasyFbSoft.Tests.csproj -c Release

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = '${{ inputs.version }}'
          }

          # An MSI ProductVersion has to be purely numeric, so a
          # pre-release suffix (1.2.3-beta.1) is trimmed for the MSI
          # while the artifact file names keep the full version.
          $msiVersion = ($version -split '-')[0]

          if ($msiVersion -notmatch '^\d+(\.\d+){0,3}$') {
            throw "Version '$version' does not begin with a numeric version."
          }

          "version=$version"       >> $env:GITHUB_OUTPUT
          "msiVersion=$msiVersion" >> $env:GITHUB_OUTPUT

          Write-Host "Building $version (MSI ProductVersion $msiVersion)"

      - name: Publish both distributions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          # publish    -> .NET bundled, runs on a bare machine
          # publish-fx -> needs the .NET Desktop Runtime installed
          dotnet publish EasyFbSoft.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:Version=${{ steps.version.outputs.msiVersion }} `
            -o publish

          dotnet publish EasyFbSoft.csproj `
            -c Release -r win-x64 --self-contained false `
            -p:Version=${{ steps.version.outputs.msiVersion }} `
            -o publish-fx

          foreach ($dir in 'publish', 'publish-fx') {
            if (-not (Test-Path "$dir/EasyFbSoft.exe")) {
              throw "$dir/EasyFbSoft.exe is missing; that publish produced nothing to package."
            }

            $mb = [math]::Round((Get-ChildItem $dir -Recurse -File |
              Measure-Object Length -Sum).Sum / 1MB, 1)

            Write-Host "$dir : $((Get-ChildItem $dir -Recurse -File).Count) files, $mb MB"
          }

      - name: Build MSIs
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2

          if ($LASTEXITCODE -ne 0) {
            Write-Host "wix install exited $LASTEXITCODE; checking whether it is already available."
            $global:LASTEXITCODE = 0
          }

          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"

          # Fails the step with a clear message if the tool is not usable.
          wix --version

          wix build installer/Package.wxs -arch x64 `
            -d Version=${{ steps.version.outputs.msiVersion }} `
            -d PublishDir=publish `
            -o artifacts/EasyFbSoft-${{ steps.version.outputs.version }}-x64.msi

          wix build installer/Package.wxs -arch x64 `
            -d Version=${{ steps.version.outputs.msiVersion }} `
            -d PublishDir=publish-fx `
            -o artifacts/EasyFbSoft-${{ steps.version.outputs.version }}-x64-framework.msi

      - name: Build EXE installers
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found at $iscc"
          }

          & $iscc /DAppVersion=${{ steps.version.outputs.version }} `
            installer\EasyFbSoft.iss

          & $iscc /DAppVersion=${{ steps.version.outputs.version }} `
            /DPublishDir=publish-fx /DVariant=-framework /DRequireRuntime=1 `
            installer\EasyFbSoft.iss

      - name: Checksums
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem artifacts -Filter *.msi)
          $exe = @(Get-ChildItem artifacts -Filter *-setup.exe)

          if ($msi.Count -ne 2) { throw "Expected two .msi files in artifacts, found $($msi.Count)." }
          if ($exe.Count -ne 2) { throw "Expected two setup .exe files in artifacts, found $($exe.Count)." }

          $lines = Get-ChildItem artifacts -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }

          $lines | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii

          Get-ChildItem artifacts -File |
            Select-Object Name, @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } } |
            Format-Table -AutoSize | Out-String | Write-Host

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: artifacts/*
          if-no-files-found: error

      - name: Compose release notes
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'

          # The section for this version runs from its heading to the
          # next version heading or the link block at the foot of the
          # file, whichever comes first.
          $pattern = '(?ms)^##\s*\[' + [regex]::Escape($version) +
            '\][^\r\n]*\r?\n(.*?)(?=^##\s*\[|^\[[^\]]+\]:\s*http|\z)'

          $found = [regex]::Match((Get-Content CHANGELOG.md -Raw), $pattern)

          if ($found.Success) {
            $section = $found.Groups[1].Value.Trim()
          } else {
            $section = ''
          }

          if (-not $section) {
            $message = "CHANGELOG.md has no notes under '## [$version]'. " +
              "Run scripts/new-release.ps1 -Version $version before tagging."

            # A tagged release without notes is a mistake worth stopping
            # for; a manual run is a packaging test, so it only warns.
            if ($env:GITHUB_REF_TYPE -eq 'tag') { throw $message }

            Write-Host "::warning::$message"
          }

          $install = (Get-Content .github/release-notes-template.md -Raw).
            Replace('{{VERSION}}', $version).
            Replace('{{TAG}}', "v$version")

          if ($section) {
            $notes = "## What changed`n`n$section`n`n---`n`n$install"
          } else {
            $notes = $install
          }

          Set-Content release-notes.md $notes -Encoding utf8

          Write-Host "----- release body -----"
          Get-Content release-notes.md | Write-Host

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = (Get-ChildItem artifacts -File).FullName

          gh release view $tag *> $null

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; replacing its assets."
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files `
              --title "Easy FB Soft $tag" `
              --notes-file release-notes.md
          }
